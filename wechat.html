<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微信</title>
  <style>
    :root {
      --green: #07c160;
      --sidebar: #2e2e2e;
      --panel: #f7f7f7;
      --line: #e4e4e4;
      --text: #1f2329;
      --muted: #8a8f99;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(7, 193, 96, .16), transparent 26%),
        linear-gradient(135deg, #dde9ef, #edf2f5 42%, #d7e4eb);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 42px));
      height: min(760px, calc(100vh - 42px));
      margin: 21px auto;
      display: grid;
      grid-template-columns: 68px 310px 1fr;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 8px;
      background: white;
      box-shadow: 0 28px 80px rgba(28, 39, 56, .24);
    }

    .rail {
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      padding: 18px 0 14px;
      background: var(--sidebar);
      color: #d4d4d4;
    }

    .my-avatar,
    .avatar {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #cfd7df, #9aa7b4);
      color: white;
      font-weight: 600;
      user-select: none;
    }

    .my-avatar {
      width: 42px;
      height: 42px;
      border-radius: 5px;
      font-size: 17px;
    }

    .my-avatar img,
    .avatar img,
    .bubble-avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .rail-nav {
      display: grid;
      gap: 12px;
      align-content: start;
      margin-top: 34px;
    }

    .rail-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #bfc1c5;
      cursor: pointer;
    }

    .rail-btn:hover,
    .rail-btn.active {
      background: rgba(255, 255, 255, .08);
      color: var(--green);
    }

    .rail-icon {
      width: 22px;
      height: 22px;
      position: relative;
    }

    .icon-chat {
      border-radius: 50%;
      background: currentColor;
    }

    .icon-chat::after {
      content: "";
      position: absolute;
      left: 5px;
      bottom: -3px;
      border: 5px solid transparent;
      border-top-color: currentColor;
      transform: rotate(24deg);
    }

    .icon-user {
      border-radius: 50%;
      border: 3px solid currentColor;
    }

    .icon-user::after {
      content: "";
      position: absolute;
      left: -3px;
      right: -3px;
      bottom: -7px;
      height: 12px;
      border: 3px solid currentColor;
      border-top: 0;
      border-radius: 0 0 14px 14px;
    }

    .icon-moments {
      border-radius: 50%;
      border: 3px solid currentColor;
    }

    .icon-moments::before,
    .icon-moments::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-top: 3px solid currentColor;
      transform: rotate(60deg);
    }

    .icon-moments::after {
      transform: rotate(-60deg);
    }

    .rail-bottom {
      display: grid;
      gap: 12px;
    }

    .side {
      display: grid;
      grid-template-rows: 62px 1fr 58px;
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .searchbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    .searchbox {
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border-radius: 5px;
      background: #e9e9e9;
      color: #8a8f99;
      font-size: 13px;
    }

    .add-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 5px;
      background: #e9e9e9;
      color: #555b66;
      font-size: 22px;
      line-height: 1;
    }

    .chat-list {
      overflow: auto;
    }

    .chat-item {
      width: 100%;
      min-height: 72px;
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 13px;
      border: 0;
      border-bottom: 1px solid rgba(0, 0, 0, .035);
      background: transparent;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }

    .chat-item:hover {
      background: #eeeeee;
    }

    .chat-item.active {
      background: #d9d9d9;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 5px;
      font-size: 15px;
    }

    .group-avatar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      padding: 4px;
      background: #dfe5ea;
    }

    .group-avatar span {
      border-radius: 3px;
      background: linear-gradient(135deg, #91a3b6, #627487);
    }

    .chat-main {
      min-width: 0;
    }

    .chat-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
    }

    .chat-time {
      color: var(--muted);
      font-size: 12px;
    }

    .chat-preview {
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .side-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 9px 12px;
      border-top: 1px solid var(--line);
      background: #f1f1f1;
    }

    .footer-tab {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #565d67;
      cursor: pointer;
    }

    .footer-tab:hover,
    .footer-tab.active {
      background: white;
      color: var(--green);
      box-shadow: 0 2px 8px rgba(40, 50, 70, .08);
    }

    .content {
      display: grid;
      grid-template-rows: 62px 1fr 154px;
      min-width: 0;
      min-height: 0;
      background: #f5f5f5;
      overflow: hidden;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: #f5f5f5;
    }

    .content-title {
      font-size: 17px;
      font-weight: 500;
    }

    .header-actions {
      color: #6b7280;
      letter-spacing: 2px;
    }

    .chat-view,
    .friends-view,
    .moments-view {
      display: none;
      min-height: 0;
      overflow: hidden;
    }

    .chat-view.active {
      display: grid;
      min-height: 0;
    }

    .friends-view.active,
    .moments-view.active {
      display: block;
    }

    .chat-stage {
      min-height: 0;
      padding: 26px 30px;
      overflow: auto;
      background:
        linear-gradient(#f5f5f5, #f5f5f5),
        radial-gradient(circle at 82% 10%, rgba(7, 193, 96, .08), transparent 28%);
      scrollbar-width: thin;
      scrollbar-color: #c6cbd3 transparent;
    }

    .chat-stage::-webkit-scrollbar {
      width: 8px;
    }

    .chat-stage::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #c6cbd3;
    }

    .chat-stage::-webkit-scrollbar-track {
      background: transparent;
    }

    .empty-note {
      width: min(380px, 80%);
      margin: 80px auto 0;
      padding: 26px;
      border: 1px dashed #d2d6dc;
      border-radius: 8px;
      background: rgba(255, 255, 255, .62);
      color: #777f8c;
      text-align: center;
      line-height: 1.8;
    }

    .chat-log {
      display: grid;
      gap: 14px;
      max-width: 820px;
      margin: 0 auto;
    }

    .date-divider {
      justify-self: center;
      padding: 4px 10px;
      border-radius: 4px;
      background: #dadada;
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
    }

    .message {
      display: grid;
      grid-template-columns: 38px minmax(0, max-content);
      gap: 10px;
      align-items: start;
      max-width: 74%;
    }

    .message.me {
      grid-template-columns: minmax(0, max-content) 38px;
      justify-self: end;
    }

    .bubble-avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 5px;
      background: linear-gradient(135deg, #cfd7df, #9aa7b4);
      color: white;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
    }

    .message.me .bubble-avatar {
      grid-column: 2;
      background: linear-gradient(135deg, #8ab4ff, #4d7fea);
    }

    .bubble-wrap {
      min-width: 0;
    }

    .message.me .bubble-wrap {
      grid-column: 1;
      grid-row: 1;
    }

    .sender {
      margin-bottom: 3px;
      color: #8a8f99;
      font-size: 12px;
    }

    .message.me .sender {
      text-align: right;
    }

    .bubble {
      position: relative;
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 4px;
      background: #fff;
      color: #1f2329;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 1px 0 rgba(0, 0, 0, .05);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.me .bubble {
      background: #95ec69;
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 12px;
      border: 6px solid transparent;
      border-right-color: #fff;
      border-left: 0;
    }

    .message.me .bubble::before {
      left: auto;
      right: -6px;
      border-right: 0;
      border-left-color: #95ec69;
    }

    .lost-data {
      justify-self: center;
      width: min(420px, 86%);
      padding: 16px 18px;
      border: 1px dashed #c8ccd3;
      border-radius: 8px;
      background: rgba(255, 255, 255, .66);
      color: #7a828e;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    .lost-data strong {
      display: block;
      margin-bottom: 4px;
      color: #596170;
      font-size: 14px;
      font-weight: 500;
    }

    .input-area {
      border-top: 1px solid var(--line);
      background: white;
    }

    .tool-row {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 22px;
      color: #666d78;
      font-size: 20px;
    }

    .composer {
      height: calc(100% - 42px);
      padding: 8px 22px 16px;
      color: #a0a6af;
      font-size: 14px;
    }

    .friends-view,
    .moments-view {
      grid-row: 2 / 4;
      padding: 26px;
      background: #f5f5f5;
      overflow: auto;
    }

    .simple-panel {
      max-width: 620px;
      margin: 40px auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      box-shadow: 0 10px 32px rgba(35, 45, 60, .06);
    }

    .panel-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      font-size: 18px;
      font-weight: 500;
    }

    .panel-body {
      padding: 22px;
      color: #737b87;
      line-height: 1.9;
    }

    .moments-cover {
      height: 190px;
      display: grid;
      align-items: end;
      padding: 18px;
      color: white;
      background:
        linear-gradient(180deg, transparent, rgba(0, 0, 0, .38)),
        linear-gradient(135deg, #7fb7cd, #5b8fa7 46%, #9eb7bd);
    }

    @media (max-width: 820px) {
      .app {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border-radius: 0;
        grid-template-columns: 58px 260px 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="WeChat desktop mockup">
    <aside class="rail" aria-label="Main navigation">
      <div class="my-avatar"><img src="JHY.jpg" alt="金鸿宇"></div>

      <nav class="rail-nav">
        <button class="rail-btn active" data-view="chat" aria-label="聊天"><span class="rail-icon icon-chat"></span></button>
        <button class="rail-btn" data-view="friends" aria-label="好友"><span class="rail-icon icon-user"></span></button>
        <button class="rail-btn" data-view="moments" aria-label="朋友圈"><span class="rail-icon icon-moments"></span></button>
      </nav>

      <div class="rail-bottom">
        <button class="rail-btn" aria-label="菜单">☰</button>
      </div>
    </aside>

    <section class="side" aria-label="Chat list panel">
      <div class="searchbar">
        <div class="searchbox">⌕ 搜索</div>
        <button class="add-btn" aria-label="添加">+</button>
      </div>

      <div class="chat-list">
        <button class="chat-item" data-chat="613宿舍群">
          <div class="avatar">
            <img src="Q.jpg" alt="613宿舍群">
          </div>
          <div class="chat-main">
            <div class="chat-title-row"><div class="chat-name">613宿舍群</div><div class="chat-time">刚刚</div></div>
            <div class="chat-preview">聊天内容稍后添加</div>
          </div>
        </button>

        <button class="chat-item active" data-chat="阿吐">
          <div class="avatar">
            <img src="TU.jpg" alt="阿吐">
          </div>
          <div class="chat-main">
            <div class="chat-title-row"><div class="chat-name">阿吐</div><div class="chat-time">6/17</div></div>
            <div class="chat-preview">数据丢失</div>
          </div>
        </button>

        <button class="chat-item" data-chat="昉鹍">
          <div class="avatar">
            <img src="FK.jpg" alt="昉鹍">
          </div>
          <div class="chat-main">
            <div class="chat-title-row"><div class="chat-name">昉鹍</div><div class="chat-time">周一</div></div>
            <div class="chat-preview">聊天内容稍后添加</div>
          </div>
        </button>

        <button class="chat-item" data-chat="饼子">
          <div class="avatar">
            <img src="BZ.jpg" alt="饼子">
          </div>
          <div class="chat-main">
            <div class="chat-title-row"><div class="chat-name">饼子</div><div class="chat-time">周日</div></div>
            <div class="chat-preview">聊天内容稍后添加</div>
          </div>
        </button>

        <button class="chat-item" data-chat="貂毛">
          <div class="avatar">
            <img src="DM.jpg" alt="貂毛">
          </div>
          <div class="chat-main">
            <div class="chat-title-row"><div class="chat-name">貂毛</div><div class="chat-time">6/15</div></div>
            <div class="chat-preview">聊天内容稍后添加</div>
          </div>
        </button>

        <button class="chat-item" data-chat="公众号">
          <div class="avatar">
            <img src="GZH.jpg" alt="公众号">
          </div>
          <div class="chat-main">
            <div class="chat-title-row"><div class="chat-name">公众号</div><div class="chat-time">6/14</div></div>
            <div class="chat-preview">推送内容稍后添加</div>
          </div>
        </button>
      </div>

      <div class="side-footer">
        <button class="footer-tab" data-view="friends"><span class="rail-icon icon-user"></span>好友</button>
        <button class="footer-tab" data-view="moments"><span class="rail-icon icon-moments"></span>朋友圈</button>
      </div>
    </section>

    <section class="content" aria-label="Content area">
      <header class="content-header">
        <div class="content-title" id="contentTitle">阿吐</div>
        <div class="header-actions">···</div>
      </header>

      <section class="chat-view active" id="chatView">
        <div class="chat-stage">
          <div class="empty-note" id="chatPlaceholder">
            当前打开：阿吐<br>
            正在载入聊天记录...
          </div>
        </div>
      </section>

      <section class="friends-view" id="friendsView">
        <div class="simple-panel">
          <div class="panel-head">好友</div>
          <div class="panel-body">好友页面已预留。之后可以在这里添加联系人、分组、资料卡或新的聊天入口。</div>
        </div>
      </section>

      <section class="moments-view" id="momentsView">
        <div class="simple-panel">
          <div class="moments-cover">
            <div>
              <div style="font-size: 22px; font-weight: 500;">朋友圈</div>
              <div style="font-size: 13px; opacity: .86;">内容稍后添加</div>
            </div>
          </div>
          <div class="panel-body">朋友圈页面已预留。稍后告诉我动态内容、图片和评论，我可以继续补成真实时间线。</div>
        </div>
      </section>

      <div class="input-area" id="inputArea">
        <div class="tool-row">☺ 📎 ✂︎ 🖼</div>
        <div class="composer">输入聊天内容...</div>
      </div>
    </section>
  </main>

  <script>
    const chatItems = document.querySelectorAll(".chat-item");
    const navButtons = document.querySelectorAll("[data-view]");
    const contentTitle = document.getElementById("contentTitle");
    const chatPlaceholder = document.getElementById("chatPlaceholder");
    const chatView = document.getElementById("chatView");
    const friendsView = document.getElementById("friendsView");
    const momentsView = document.getElementById("momentsView");
    const inputArea = document.getElementById("inputArea");
    const chatStage = document.querySelector(".chat-stage");
    let activeChatName = "阿吐";

    const avatarMap = {
      "金鸿宇": "JHY.jpg",
      "阿吐": "TU.jpg",
      "613宿舍群": "Q.jpg",
      "昉鹍": "FK.jpg",
      "饼子": "BZ.jpg",
      "貂毛": "DM.jpg",
      "公众号": "GZH.jpg"
    };

    const chatRecords = {
      "阿吐": [
        { type: "date", text: "6月15日 12：32" },
        { from: "阿吐", text: "干嘛" },
        { from: "金鸿宇", me: true, text: "那个班级要收集每个人的实验报告，你记得收一下" },
        { from: "阿吐", text: "？你不是班长吗？" },
        { from: "金鸿宇", me: true, text: "没事，就交给你了😀" },
        { from: "阿吐", text: "谔谔" },
        { type: "date", text: "6月15日 18：33" },
        { from: "金鸿宇", me: true, text: "等外卖这半小时" },
        { from: "金鸿宇", me: true, text: "我去健身房了" },
        { from: "金鸿宇", me: true, text: "NB吗" },
        { from: "阿吐", text: "？" },
        { from: "阿吐", text: "！？逼逼？！" },
        { type: "date", text: "6月16日9：17" },
        { from: "阿吐", text: "你端午节要出去吗？" },
        { from: "金鸿宇", me: true, text: "出去啊，干啥？" },
        { from: "阿吐", text: "没事，就问问。" },
        { from: "阿吐", text: "你去哪啊。" },
        { from: "金鸿宇", me: true, text: "必须去 ████ 啊，早就想去了。" },
        { type: "date", text: "6月17日？？：？？" },
        { type: "lost", title: "数据丢失", text: "该日期之后的聊天记录暂时无法显示。" }
      ]
    };

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function renderChat(name) {
      const records = chatRecords[name];
      if (!records) {
        chatPlaceholder.className = "empty-note";
        chatPlaceholder.innerHTML = `当前打开：${escapeHtml(name)}<br>聊天内容稍后告诉我后，可以直接填到这里。`;
        return;
      }

      chatPlaceholder.className = "chat-log";
      chatPlaceholder.innerHTML = records.map((item) => {
        if (item.type === "date") {
          return `<div class="date-divider">${escapeHtml(item.text)}</div>`;
        }
        if (item.type === "lost") {
          return `<div class="lost-data"><strong>${escapeHtml(item.title)}</strong>${escapeHtml(item.text)}</div>`;
        }

        const side = item.me ? "me" : "other";
        const avatarSrc = avatarMap[item.from];
        const avatarFallback = item.me ? "金" : "阿";
        const avatar = avatarSrc
          ? `<img src="${avatarSrc}" alt="${escapeHtml(item.from)}">`
          : escapeHtml(avatarFallback);
        return `
          <div class="message ${side}">
            <div class="bubble-avatar">${avatar}</div>
            <div class="bubble-wrap">
              <div class="sender">${escapeHtml(item.from)}</div>
              <div class="bubble">${escapeHtml(item.text)}</div>
            </div>
          </div>
        `;
      }).join("");

      requestAnimationFrame(() => {
        chatStage.scrollTop = chatStage.scrollHeight;
      });
    }

    function showView(view, title) {
      chatView.classList.toggle("active", view === "chat");
      friendsView.classList.toggle("active", view === "friends");
      momentsView.classList.toggle("active", view === "moments");
      inputArea.style.display = view === "chat" ? "block" : "none";
      contentTitle.textContent = title;

      document.querySelectorAll(".rail-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === view);
      });
      document.querySelectorAll(".footer-tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === view);
      });
    }

    chatItems.forEach((item) => {
      item.addEventListener("click", () => {
        chatItems.forEach((chat) => chat.classList.remove("active"));
        item.classList.add("active");
        activeChatName = item.dataset.chat;
        showView("chat", activeChatName);
        renderChat(activeChatName);
      });
    });

    navButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const view = button.dataset.view;
        if (view === "friends") showView("friends", "好友");
        if (view === "moments") showView("moments", "朋友圈");
        if (view === "chat") {
          const activeChat = document.querySelector(".chat-item.active");
          activeChatName = activeChat ? activeChat.dataset.chat : activeChatName;
          showView("chat", activeChatName);
          renderChat(activeChatName);
        }
      });
    });

    renderChat("阿吐");
  </script>
</body>
</html>
