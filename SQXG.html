<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>南京水泉弦根有限公司</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#fff;
    color:#1f2937;
    line-height:1.7;
}

/* ===== 顶部导航 ===== */
header{
    border-bottom:1px solid #e5e7eb;
    position:relative;
}

.nav{
    max-width:1200px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-text{
    font-size:18px;
    font-weight:600;
    letter-spacing:2px;
}

nav ul{
    list-style:none;
    display:flex;
    gap:28px;
    font-size:15px;
}

/* ===== 搜索框 ===== */
.search-box{
    position:relative;
}

.search-box input{
    border:1px solid #d1d5db;
    padding:6px 28px 6px 10px;
    border-radius:6px;
    font-size:14px;
}

.search-box button{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    font-size:14px;
    color:#374151;
}

/* ===== Hero 区 ===== */
.hero{
    position:relative;
    max-width:1200px;
    margin:100px auto;
    padding:0 24px;
}

/* 装饰线条 */
.hero::before{
    content:"";
    position:absolute;
    left:24px;
    top:-40px;
    width:80px;
    height:2px;
    background:#1e3a8a;
}

.hero::after{
    content:"";
    position:absolute;
    right:24px;
    bottom:-40px;
    width:120px;
    height:1px;
    background:#9ca3af;
}

.hero h1{
    font-size:42px;
    margin-bottom:24px;
}

.hero p{
    max-width:520px;
    font-size:17px;
    color:#4b5563;
}

/* ===== 区块通用 ===== */
.section{
    max-width:1200px;
    margin:120px auto;
    padding:0 24px;
    position:relative;
}

.section h2{
    font-size:30px;
    margin-bottom:40px;
    position:relative;
}

.section h2::after{
    content:"";
    display:block;
    width:60px;
    height:3px;
    background:#1e3a8a;
    margin-top:12px;
}

.about{
    max-width:720px;
}

/* ===== 业务卡片 ===== */
.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:40px;
}

.card{
    border:1px solid #e5e7eb;
    padding:36px;
    border-radius:12px;
    position:relative;
}

.card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,#1e3a8a,#93c5fd);
}

.card h3{
    margin-bottom:16px;
}

/* ===== Footer ===== */
footer{
    margin-top:120px;
    background:#0f172a;
    color:#cbd5f5;
    padding:40px 24px;
}

.footer-inner{
    max-width:1200px;
    margin:0 auto;
    font-size:14px;
}

/* 响应式 */
@media(max-width:900px){
    .services{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
<div class="nav">
    <div class="logo">
        <!-- Logo -->
        <svg width="40" height="40" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" stroke="#1e3a8a" stroke-width="6" fill="none"/>
            <path d="M20 55 C35 35,65 35,80 55" stroke="#1e3a8a" stroke-width="6" fill="none"/>
            <line x1="50" y1="55" x2="50" y2="78" stroke="#1e3a8a" stroke-width="6"/>
        </svg>
        <div class="logo-text">水泉弦根</div>
    </div>

    <nav>
        <ul>
            <li>首页</li>
            <li>关于我们</li>
            <li>业务领域</li>
            <li>联系我们</li>
        </ul>
    </nav>

    <!-- 搜索 -->
    <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索…" />
        <button onclick="doSearch()">⌕</button>
    </div>
</div>
</header>

<section class="hero">
<h1>连接技术之源<br>夯实发展之根</h1>
<p>
南京水泉弦根有限公司以系统性工程思维，
构建稳定、可演进的信息化基础设施。
</p>
</section>

<section class="section">
<h2>公司简介</h2>
<p class="about">
南京水泉弦根有限公司立足南京，专注软件系统研发、
技术咨询与数字化解决方案，
强调长期价值与结构稳定性。
</p>
</section>

<section class="section">
<h2>业务领域</h2>
<div class="services">
    <div class="card">
        <h3>软件系统开发</h3>
        <p>定制软件、后台系统与工程工具平台。</p>
    </div>
    <div class="card">
        <h3>技术咨询服务</h3>
        <p>系统架构、技术路线与工程决策支持。</p>
    </div>
    <div class="card">
        <h3>数字化解决方案</h3>
        <p>业务流程数字化与效率提升方案。</p>
    </div>
</div>
</section>

<footer>
<div class="footer-inner">
© 2026 南京水泉弦根有限公司<br>
Nanjing Shuiquan Xiangen Co., Ltd.
</div>
</footer>

<script>
function doSearch(){
    const value=document.getElementById("searchInput").value.trim();

    // 触发关键词
    const keywords={
        "软件":"软件系统开发",
        "咨询":"技术咨询服务",
        "数字化":"数字化解决方案",
        "公司":"南京水泉弦根有限公司"
    };

    if(keywords[value]){
        alert("搜索结果：" + keywords[value]);
    }
    // 没命中：完全不反应
}
</script>

</body>
</html>
