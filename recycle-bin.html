<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回收站</title>
  <style>
    :root {
      --line: #dce3ee;
      --text: #1f2937;
      --muted: #687386;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 28% 24%, rgba(96, 165, 250, .2), transparent 30%),
        linear-gradient(135deg, #e7eef7, #f7fafc);
    }

    .explorer {
      width: min(1040px, calc(100vw - 36px));
      height: min(700px, calc(100vh - 36px));
      margin: 18px auto;
      display: grid;
      grid-template-rows: 38px 52px 1fr;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 8px;
      background: rgba(248, 250, 255, .88);
      box-shadow: 0 28px 80px rgba(31, 44, 80, .22);
      backdrop-filter: blur(24px) saturate(150%);
    }

    .titlebar,
    .bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .72);
    }

    .titlebar {
      gap: 10px;
      padding: 0 12px;
      font-size: 13px;
    }

    .bar {
      gap: 12px;
      padding: 9px 14px;
    }

    .bin {
      width: 20px;
      height: 24px;
      border: 2px solid #5b6b82;
      border-top: 5px solid #5b6b82;
      border-radius: 2px 2px 5px 5px;
      background: linear-gradient(135deg, #e0f2fe, #93c5fd);
    }

    .btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #445166;
      text-decoration: none;
    }

    .btn:hover {
      background: #edf2f7;
    }

    .address {
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid #d7dfeb;
      border-radius: 5px;
      background: white;
      color: #435166;
      font-size: 13px;
    }

    .content {
      padding: 22px;
      overflow: auto;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      height: 420px;
      display: grid;
      place-items: center;
      border: 1px dashed #c7d2e3;
      border-radius: 8px;
      background: rgba(255, 255, 255, .62);
      color: #687386;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="explorer" aria-label="Recycle Bin">
    <section class="titlebar"><span class="bin"></span><span>回收站 - 文件资源管理器</span></section>
    <section class="bar">
      <a class="btn" href="win11-desktop.html" aria-label="Back">‹</a>
      <span class="btn">›</span>
      <span class="btn">↻</span>
      <div class="address">桌面 › 回收站</div>
    </section>
    <section class="content">
      <div class="heading">
        <h1>回收站</h1>
        <div class="hint">0 个项目</div>
      </div>
      <div class="empty">
        <div>
          回收站是空的<br>
          删除的文件会显示在这里。
        </div>
      </div>
    </section>
  </main>
</body>
</html>
