<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>南京水泉弦根有限公司</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#ffffff;
    color:#1f2937;
}

/* ================= 页眉（保持不变） ================= */
header{
    border-bottom:1px solid #e5e7eb;
}

.nav{
    max-width:1200px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-text{
    font-size:18px;
    font-weight:600;
    letter-spacing:2px;
}

nav ul{
    list-style:none;
    display:flex;
    gap:28px;
    font-size:15px;
}

/* ================= 主体警示区域 ================= */
.warning-area{
    width:100vw;
    height:calc(100vh - 160px);
    background:#4b0000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

.warning-text{
    color:#ff1a1a;
    font-size:clamp(72px, 12vw, 220px);
    font-weight:900;
    letter-spacing:14px;
    text-align:center;
    line-height:1.1;
    user-select:none;

    /* 呼吸式闪动 */
    animation:breath 5s ease-in-out infinite;
}

/* 呼吸动画 */
@keyframes breath{
    0%   { opacity:0.85; }
    50%  { opacity:1; }
    100% { opacity:0.85; }
}

/* 抖动状态（由 JS 随机触发） */
.shake{
    transform:translate(var(--x), var(--y));
}

/* ================= 页脚（保持不变） ================= */
footer{
    background:#0f172a;
    color:#cbd5f5;
    padding:40px 24px;
}

.footer-inner{
    max-width:1200px;
    margin:0 auto;
    font-size:14px;
}
</style>
</head>

<body>

<header>
<div class="nav">
    <div class="logo">
        <svg width="40" height="40" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" stroke="#1e3a8a" stroke-width="6" fill="none"/>
            <path d="M20 55 C35 35,65 35,80 55" stroke="#1e3a8a" stroke-width="6" fill="none"/>
            <line x1="50" y1="55" x2="50" y2="78" stroke="#1e3a8a" stroke-width="6"/>
        </svg>
        <div class="logo-text">水泉弦根</div>
    </div>

    <nav>
        <ul>
            <li>首页</li>
            <li>关于我们</li>
            <li>业务领域</li>
            <li>联系我们</li>
        </ul>
    </nav>
</div>
</header>

<!-- ================= 主体内容 ================= -->
<main class="warning-area">

    <!-- 🎧 背景音（你在 src="" 中填写音频地址）
         示例：
         src="audio/bg.mp3"
         或 src="https://example.com/xxx.mp3"
    -->
    <audio id="bgm" loop>
        <source src="MOS.mp3" type="audio/mpeg">
    </audio>

    <div id="warningText" class="warning-text">
        不要试图寻找
    </div>

</main>

<footer>
<div class="footer-inner">
© 2026 南京水泉弦根有限公司<br>
Nanjing Shuiquan Xiangen Co., Ltd.
</div>
</footer>

<script>
/* ===== 解决浏览器限制的音频播放逻辑 ===== */
const bgm = document.getElementById("bgm");

function tryPlayBPM() {
    if (bgm) {
        bgm.play()
        .then(() => {
            // 播放成功后，移除事件监听，避免重复触发
            document.removeEventListener('click', tryPlayBPM);
            document.removeEventListener('keydown', tryPlayBPM);
        })
        .catch((e) => {
            console.log("播放失败，等待用户交互:", e);
        });
    }
}

// 1. 页面加载 2 秒后尝试自动播放（部分浏览器或配置下可能会成功）
setTimeout(tryPlayBPM, 2000);

// 2. 如果被拦截，用户点击页面或按下任意键时立即触发播放
document.addEventListener('click', tryPlayBPM);
document.addEventListener('keydown', tryPlayBPM);


/* ===== 偶发 1px 抖动（保持原样） ===== */
const text = document.getElementById("warningText");

function randomShake(){
    const x = (Math.random() > 0.5 ? 1 : -1);
    const y = (Math.random() > 0.5 ? 1 : -1);

    text.style.setProperty('--x', x + 'px');
    text.style.setProperty('--y', y + 'px');
    text.classList.add('shake');

    setTimeout(()=>{
        text.classList.remove('shake');
    },120);
}

/* 每 3~6 秒随机触发一次抖动 */
setInterval(()=>{
    if(Math.random() > 0.5){
        randomShake();
    }
},3000 + Math.random()*3000);
</script>

</body>
</html>
