<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片动态模板</title>
  <style>
    :root { font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #1f2329; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #ededed; }
    .phone { width: min(430px, 100vw); min-height: 100vh; margin: 0 auto; background: #fff; box-shadow: 0 0 34px rgba(0,0,0,.14); }
    .top { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #ececec; }
    .top a { color: #1f2329; text-decoration: none; font-size: 22px; }
    .top strong { font-size: 17px; font-weight: 500; }
    .post { display: grid; grid-template-columns: 46px 1fr; gap: 12px; padding: 18px 16px; }
    .avatar { width: 46px; height: 46px; border-radius: 6px; overflow: hidden; background: #d8dee8; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { color: #576b95; font-weight: 600; margin-bottom: 8px; }
    .text { min-height: 72px; line-height: 1.65; white-space: pre-wrap; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0; }
    .pic { aspect-ratio: 1; display: grid; place-items: center; background: linear-gradient(135deg, #dbeafe, #93c5fd); color: #3b4b66; font-size: 12px; text-align: center; padding: 8px; }
    .meta { display: flex; justify-content: space-between; color: #8a8f99; font-size: 12px; margin-top: 8px; }
    .comments { margin-top: 10px; padding: 10px; background: #f3f3f3; color: #576b95; font-size: 13px; line-height: 1.7; }
    [contenteditable] { outline: 1px dashed transparent; border-radius: 4px; }
    [contenteditable]:focus { outline-color: #07c160; background: #f6fff9; }
    .note { padding: 12px 16px; color: #8a8f99; font-size: 12px; line-height: 1.7; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <main class="phone">
    <header class="top"><a href="wechat.html">‹</a><strong>图片动态模板</strong></header>
    <section class="post">
      <div class="avatar"><img src="JHY.jpg" alt="头像"></div>
      <div>
        <div class="name" contenteditable="true">金鸿宇</div>
        <div class="text" contenteditable="true">这里填写朋友圈正文。
可以换成你想发的内容。</div>
        <div class="grid">
          <div class="pic" contenteditable="true">图片1<br>把这里改成 img 标签</div>
          <div class="pic" contenteditable="true">图片2</div>
          <div class="pic" contenteditable="true">图片3</div>
        </div>
        <div class="meta"><span contenteditable="true">秦皇岛 · 刚刚</span><span>··</span></div>
        <div class="comments" contenteditable="true">阿吐：这里填写评论<br>饼子：这里填写评论</div>
      </div>
    </section>
    <div class="note">可直接改文字；要换图片，把图片占位块替换成：&lt;img src="你的图片.jpg" style="width:100%;height:100%;object-fit:cover;"&gt;</div>
  </main>
</body>
</html>
